
name: IoT Monitoring CI

# Start automatisk ved ændringer på GitHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Midlertidig MySQL til vores tests
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password_123
          MYSQL_DATABASE: iot_monitoring_test
          MYSQL_USER: iot_user
          MYSQL_PASSWORD: ci_test_password_456
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Databaseindstillinger til Python
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_NAME: iot_monitoring_test
      MYSQL_PASSWORD: ci_test_password_456

    steps:
      - name: Hent projektets kode
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Python-pakker
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Opret testtabeller
        run: python database_mysql.py

      - name: Koer automatiske tests
        run: python -m pytest -v

      - name: Byg Docker-image
        run: docker build -t iot-monitoring:ci .



  # Publicer Docker-image, når alle tests er bestået
  publish-image:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Hent projektets kode
        uses: actions/checkout@v7

      - name: Klargoer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log ind paa GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Byg og publicer Docker-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/frederikkelf/iot-monitoring-mvp:latest
            ghcr.io/frederikkelf/iot-monitoring-mvp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/FrederikkeLF/iot-monitoring-mvp
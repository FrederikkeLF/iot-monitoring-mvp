
services:

  # Vores MySQL-database
  db:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: iot_monitoring
      MYSQL_USER: iot_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u iot_user -p\"$$MYSQL_PASSWORD\" -D iot_monitoring -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Vores Python REST API
  api:
    build: .

    ports:
      - "8002:8000"

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

